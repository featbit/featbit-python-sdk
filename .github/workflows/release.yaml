# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Upload Python Package

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: py-production
    steps:
      - uses: actions/checkout@v4
      - name: Read current version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("release/package.json") as file:
              print("value=%s" % json.load(file)["version"])
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file release/description.md
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
          verify-metadata: false