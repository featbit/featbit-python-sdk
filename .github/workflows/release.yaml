name: Upload Python Package

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build and verify distributions
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.14"
      - name: Read current version
        id: version
        run: |
          version="$(uv version --short)"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build
      - name: Check package metadata
        run: uv run --locked --only-group release twine check dist/*
      - name: Install and smoke-test the built wheel
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          wheel_env="$RUNNER_TEMP/featbit-wheel-test"
          uv venv "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          uv pip check --python "$wheel_env/bin/python"
          "$wheel_env/bin/python" scripts/wheel_smoke.py \
            --bootstrap tests/fbclient_test_data.json \
            --expected-version "$VERSION"
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  deploy:
    name: Publish to PyPI
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    # GitHub enforces Required reviewers on the py-production environment.
    environment: py-production
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release/description.md
      - name: Publish package distributions to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish
