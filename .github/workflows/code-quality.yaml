name: Python Linting and Testing

on: 
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint and formatting with Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test with pytest
        run: uv run --no-sync python -m pytest
      - name: Audit concurrency, memory, and thread cleanup
        if: matrix.python-version == '3.12' || matrix.python-version == '3.14'
        run: uv run --no-sync python scripts/resource_audit.py --evaluations 20000 --workers 8
      - name: Build production distributions
        if: matrix.python-version == '3.12' || matrix.python-version == '3.14'
        run: uv build
      - name: Verify wheel contains production packages only
        if: matrix.python-version == '3.12' || matrix.python-version == '3.14'
        run: uv run --no-sync python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert not any(name.startswith(('tests/', 'featbit_openfeature/')) for name in names)"
      - name: Install and smoke-test the built wheel
        if: matrix.python-version == '3.14'
        run: |
          wheel_env="$RUNNER_TEMP/featbit-wheel-test"
          uv venv "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          uv pip check --python "$wheel_env/bin/python"
          version="$(uv version --short)"
          "$wheel_env/bin/python" scripts/wheel_smoke.py \
            --bootstrap tests/fbclient_test_data.json \
            --expected-version "$version"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test with pytest
        run: uv run --no-sync python -m pytest

  minimum-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.14"
      - name: Install exact minimum dependencies
        run: |
          uv sync --locked
          uv pip install \
            certifi==2018.4.16 \
            urllib3==1.26.5 \
            python-dateutil==2.8.2 \
            websocket-client==1.0.0
          uv pip check
      - name: Test with pytest
        run: uv run --no-sync python -m pytest
      - name: Audit concurrency, memory, and thread cleanup
        run: uv run --no-sync python scripts/resource_audit.py --evaluations 20000 --workers 8
