minimum_pre_commit_version: "4.4.0"
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: unsupported
        always_run: true
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format .
        language: unsupported
        always_run: true
        pass_filenames: false
      - id: pytest
        name: Run all tests
        entry: uv run --locked python -m pytest
        language: unsupported
        always_run: true
        pass_filenames: false
